# Include these locations inside both public-site server blocks.
# The root directive must point to vue-app/dist before this file is included.

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types
    application/javascript
    application/json
    application/xml
    application/wasm
    font/woff2
    image/svg+xml
    text/css
    text/plain;

# Let browsers validate changed files cheaply when a URL is not fingerprinted.
etag on;

# Vite writes fingerprinted bundles to /assets/, so they are safe to keep for a year.
location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

# Fonts are stable public files and expensive enough to cache aggressively.
location ^~ /fonts/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    access_log off;
}

location = /logo-192.webp {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

# Hero assets are large and dominate PageSpeed cache warnings.
# Keep them long-lived; if a file changes visually, deploy it under a new name.
location ^~ /hero-assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

# Public root files that are not under /assets/ or /hero-assets/.
location ~* ^/(?:[^/]+\.(?:webp|avif|png|jpe?g|gif|svg|ico|pdf|woff2?))$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    access_log off;
}

# index.html must always be revalidated so it never points to obsolete bundle hashes.
location = /index.html {
    expires off;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

# SPA fallback should not be stored as a static asset.
location = / {
    expires off;
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files /index.html =404;
}

# Replace the existing /uploads/ location with this block.
location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_valid 200 30d;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    access_log off;
}
